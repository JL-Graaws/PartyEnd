# UTC time the End opens, e.g. "2026-11-01T18:00:00Z" (keep the quotes).
# Leave it as "" (or none/now) to open the End immediately.
open-at: ""

# Seed used for NEW instances only. Existing instances keep the seed they were made with.
seed: 20261015

# Radius (blocks) of each instance's world border
border-radius: 1500

# Days after last activity before an instance is deleted
retention-days: 14
# Shorter timeout once every member of the host's party has killed the dragon
cleared-retention-days: 7
# Warn players on login when their End will be deleted within this many days
warn-days: 3

# Difficulty of each End: inherit (copy the main overworld), peaceful, easy, normal or hard
difficulty: inherit

# Dragon health scaling by party size. Max health is multiplied by
#   1 + dragon-health-per-extra-member * (partySize - 1), up to dragon-max-health-multiplier.
# The size is read when the dragon first appears. Set the per-member value to 0 to turn scaling off.
dragon-health-per-extra-member: 0.5
dragon-max-health-multiplier: 5.0

# Cap on simultaneously loaded instances (world creation is main-thread work)
max-loaded-instances: 10
